<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" width="1400" height="900"
     font-family="'Microsoft JhengHei','PingFang TC','Noto Sans TC',sans-serif">
  <defs>
    <!-- 共用元件 -->
    <g id="tower">
      <polygon points="548,560 652,560 640,178 560,178" fill="#ecfeff" stroke="#0d9488" stroke-width="2"/>
      <ellipse cx="600" cy="176" rx="40" ry="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="2"/>
      <text x="600" y="330" text-anchor="middle" font-size="18" font-weight="bold" fill="#0f766e">冷</text>
      <text x="600" y="354" text-anchor="middle" font-size="18" font-weight="bold" fill="#0f766e">卻</text>
      <text x="600" y="378" text-anchor="middle" font-size="18" font-weight="bold" fill="#0f766e">塔</text>
      <text x="600" y="400" text-anchor="middle" font-size="11" fill="#0f766e">（濕式）</text>
      <path d="M582,162 q-6,-8 0,-14 q6,-8 0,-14" fill="none" stroke="#94a3b8" stroke-width="2"/>
      <path d="M600,162 q-6,-8 0,-14 q6,-8 0,-14" fill="none" stroke="#94a3b8" stroke-width="2"/>
      <path d="M618,162 q-6,-8 0,-14 q6,-8 0,-14" fill="none" stroke="#94a3b8" stroke-width="2"/>
      <text x="600" y="128" text-anchor="middle" font-size="11" fill="#64748b">排熱・蒸發耗水</text>
    </g>
    <g id="bolt"><path d="M0,0 L-8,14 L-1,14 L-6,27 L9,9 L2,9 L7,0 z" fill="#facc15" stroke="#a16207" stroke-width="1"/></g>
  </defs>

  <rect width="1400" height="900" fill="#ffffff"/>

  <!-- 標題 -->
  <text x="20" y="40" font-size="24" font-weight="bold" fill="#111827">液冷廢熱驅動吸附式冰機：我們模擬的兩個情境</text>
  <text x="20" y="62" font-size="12.5" fill="#4b5563">台灣南部科學園區・10 MW AI 機房（GB300 等級）｜兩情境只改冷卻方式，其餘固定｜臺南 8760 小時氣象</text>
  <!-- 圖例 -->
  <g font-size="11" fill="#374151">
    <rect x="860" y="22" width="24" height="10" fill="#dc2626" fill-opacity="0.88"/><text x="889" y="31">液冷廢熱／驅動熱水</text>
    <rect x="1010" y="22" width="24" height="10" fill="#2563eb" fill-opacity="0.88"/><text x="1039" y="31">氣冷熱（經 18 °C 冰水）</text>
    <rect x="1180" y="22" width="24" height="10" fill="#0d9488" fill-opacity="0.88"/><text x="1209" y="31">冷卻水 → 冷卻塔</text>
    <rect x="860" y="44" width="24" height="10" fill="#eab308" fill-opacity="0.88"/><text x="889" y="53">電力輸入</text>
    <text x="1010" y="53">帶寬 ∝ 年平均熱流：</text>
    <rect x="1118" y="45.8" width="24" height="6.5" fill="#6b7280"/><text x="1147" y="53">= 1 MW</text>
    <text x="1200" y="53" fill="#6b7280">（電力流已放大以便辨識）</text>
  </g>
  <!-- ================= 左：Baseline ================= -->
  <g transform="translate(20,0)">
    <rect x="0" y="72" width="670" height="568" rx="12" fill="#fafafa" stroke="#9ca3af" stroke-width="1.5"/>
    <text x="335" y="97" text-anchor="middle" font-size="17" font-weight="bold" fill="#1f2937">Baseline：冷卻塔直接排熱 ＋ 電動冰機</text>
    <text x="335" y="116" text-anchor="middle" font-size="11.5" fill="#6b7280">情境 A 供水跟著濕球（≈25–34 °C）／情境 B 供水固定 40 °C</text>

    <!-- 機房 -->
    <rect x="20" y="130" width="180" height="430" rx="8" fill="#f3f4f6" stroke="#6b7280"/>
    <text x="110" y="150" text-anchor="middle" font-size="13" font-weight="bold" fill="#374151">AI 機房　IT 10 MW</text>
    <rect x="32" y="160" width="156" height="140" rx="6" fill="#fee2e2" stroke="#dc2626"/>
    <text x="110" y="192" text-anchor="middle" font-size="14" font-weight="bold" fill="#991b1b">液冷機櫃（DLC）</text>
    <text x="110" y="214" text-anchor="middle" font-size="11.5" fill="#7f1d1d">GB300 NVL72 × ~70 櫃</text>
    <text x="110" y="238" text-anchor="middle" font-size="16" font-weight="bold" fill="#991b1b">8.2 MW（82%）</text>
    <text x="110" y="262" text-anchor="middle" font-size="11" fill="#7f1d1d">冷板直接帶走晶片熱</text>
    <rect x="32" y="320" width="156" height="220" rx="6" fill="#dbeafe" stroke="#2563eb"/>
    <text x="110" y="352" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e3a8a">氣冷負載</text>
    <text x="110" y="376" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e3a8a">Q_air 1.8 MW（18%）</text>
    <text x="110" y="400" text-anchor="middle" font-size="11.5" fill="#1e40af">CRAH 空調箱</text>
    <text x="110" y="420" text-anchor="middle" font-size="11.5" fill="#1e40af">需要 18 °C 冰水</text>

    <!-- CDU -->
    <rect x="330" y="182" width="120" height="78" rx="6" fill="#fff7ed" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="390" y="216" text-anchor="middle" font-size="13" font-weight="bold" fill="#92400e">CDU ＋ 板換</text>
    <text x="390" y="236" text-anchor="middle" font-size="11" fill="#92400e">液冷迴路</text>

    <!-- 電動冰機 -->
    <rect x="330" y="395" width="120" height="95" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="390" y="428" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e3a8a">電動冰機</text>
    <text x="390" y="450" text-anchor="middle" font-size="12" fill="#1e40af">COP 5–6</text>
    <text x="390" y="470" text-anchor="middle" font-size="11" fill="#1e40af">全量供應 Q_air</text>
    <use href="#bolt" transform="translate(386,528) scale(0.6)"/>
    <text x="390" y="560" text-anchor="middle" font-size="11.5" fill="#a16207">電力 ≈ 261 kW（年均）</text>

    <use href="#tower"/>
    <text x="600" y="470" text-anchor="middle" font-size="11" fill="#0f766e">合計排熱</text><text x="600" y="488" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f766e">10.26 MW</text><text x="335" y="590" text-anchor="middle" font-size="10.5" fill="#6b7280">數字為年平均</text>
    <!-- 熱流帶（寬度 ∝ 年平均熱流） -->
    <path d="M188.0,200.0 C253.5,200.0 253.5,200.0 319.0,200.0 L319.0,253.3 C253.5,253.3 253.5,253.3 188.0,253.3 Z" fill="#dc2626" fill-opacity="0.88"/><path d="M319.0,190.4 L330.0,226.7 L319.0,262.9 Z" fill="#dc2626" fill-opacity="0.88"/>
    <text x="259" y="231.65" text-anchor="middle" font-size="15" font-weight="bold" fill="#fff">8.2 MW</text>
    <text x="259" y="192" text-anchor="middle" font-size="10.5" fill="#b91c1c">回水 ≈35–44 °C</text>
    <text x="259" y="267.3" text-anchor="middle" font-size="10" fill="#b45309">供水 ≈25–34 °C（濕球 + 6 K）</text>
    <path d="M450.0,200.0 C498.7,200.0 498.7,200.0 547.5,200.0 L547.5,253.3 C498.7,253.3 498.7,253.3 450.0,253.3 Z" fill="#0d9488" fill-opacity="0.88"/><path d="M547.5,190.4 L558.5,226.7 L547.5,262.9 Z" fill="#0d9488" fill-opacity="0.88"/>
    <text x="500" y="231.65" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">8.2 MW</text>
    <text x="500" y="192" text-anchor="middle" font-size="10.5" fill="#0f766e">板換 → 冷卻水</text>
    <path d="M188.0,412.0 C253.5,412.0 253.5,412.0 319.0,412.0 L319.0,423.7 C253.5,423.7 253.5,423.7 188.0,423.7 Z" fill="#2563eb" fill-opacity="0.88"/><path d="M319.0,408.5 L330.0,417.9 L319.0,427.2 Z" fill="#2563eb" fill-opacity="0.88"/>
    <text x="259" y="404" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d4ed8">1.8 MW 熱</text>
    <text x="259" y="437.7" text-anchor="middle" font-size="10" fill="#3b82f6">冰水 18 °C 供／≈24 °C 回</text>
    <rect x="388.8" y="500.0" width="2.5" height="28.0" fill="#eab308" fill-opacity="0.88"/><path d="M385.2,500.0 L390.0,490.0 L394.8,500.0 Z" fill="#eab308" fill-opacity="0.88"/>
    <path d="M450.0,412.0 C495.7,412.0 495.7,412.0 541.4,412.0 L541.4,425.4 C495.7,425.4 495.7,425.4 450.0,425.4 Z" fill="#0d9488" fill-opacity="0.88"/><path d="M541.4,408.5 L552.4,418.7 L541.4,428.9 Z" fill="#0d9488" fill-opacity="0.88"/>
    <text x="500" y="404" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f766e">2.06 MW</text>
    <text x="500" y="439.3965" text-anchor="middle" font-size="10" fill="#0f766e">冷凝 ≈37 °C</text>
    <text x="335" y="620" text-anchor="middle" font-size="12.5" fill="#374151">所有熱最後都進冷卻塔；耗電主要來自<tspan font-weight="bold">電動冰機</tspan></text>
  </g>

  <!-- ================= 右：Scenario ================= -->
  <g transform="translate(710,0)">
    <rect x="0" y="72" width="670" height="568" rx="12" fill="#f7fdf9" stroke="#16a34a" stroke-width="1.5"/>
    <text x="335" y="97" text-anchor="middle" font-size="17" font-weight="bold" fill="#14532d">Scenario：液冷回水驅動吸附式冰機</text>
    <text x="335" y="116" text-anchor="middle" font-size="11.5" fill="#6b7280">液冷回水拉高到 T_ret（52–62 °C）→ 廢熱變冷量 → 少開電動冰機</text>

    <!-- 機房 -->
    <rect x="20" y="130" width="180" height="430" rx="8" fill="#f3f4f6" stroke="#6b7280"/>
    <text x="110" y="150" text-anchor="middle" font-size="13" font-weight="bold" fill="#374151">AI 機房　IT 10 MW</text>
    <rect x="32" y="160" width="156" height="140" rx="6" fill="#fee2e2" stroke="#dc2626"/>
    <text x="110" y="192" text-anchor="middle" font-size="14" font-weight="bold" fill="#991b1b">液冷機櫃（DLC）</text>
    <text x="110" y="216" text-anchor="middle" font-size="16" font-weight="bold" fill="#991b1b">8.2 MW + ΔP_IT</text>
    <rect x="40" y="236" width="140" height="52" rx="5" fill="#ffffff" stroke="#dc2626" stroke-dasharray="4 3"/>
    <text x="110" y="256" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#dc2626">▲ 晶片跟著升溫</text>
    <text x="110" y="276" text-anchor="middle" font-size="11" fill="#dc2626">漏電流↑ → IT 多耗 25 kW</text>
    <rect x="32" y="320" width="156" height="220" rx="6" fill="#dbeafe" stroke="#2563eb"/>
    <text x="110" y="352" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e3a8a">氣冷負載</text>
    <text x="110" y="376" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e3a8a">Q_air 1.8 MW（18%）</text>
    <text x="110" y="400" text-anchor="middle" font-size="11.5" fill="#1e40af">CRAH 空調箱</text>
    <text x="110" y="420" text-anchor="middle" font-size="11.5" fill="#1e40af">需要 18 °C 冰水</text>

    <!-- CDU -->
    <rect x="330" y="180" width="120" height="90" rx="6" fill="#fff7ed" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="390" y="220" text-anchor="middle" font-size="13" font-weight="bold" fill="#92400e">CDU ＋ 板換</text>
    <text x="390" y="240" text-anchor="middle" font-size="11" fill="#92400e">液冷迴路</text>

    <!-- 驅動熱水 -->

    <!-- 吸附式冰機 -->
    <rect x="330" y="312" width="120" height="90" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="390" y="338" text-anchor="middle" font-size="14" font-weight="bold" fill="#14532d">吸附式冰機</text>
    <text x="390" y="358" text-anchor="middle" font-size="11" fill="#166534">矽膠-水</text>
    <text x="390" y="376" text-anchor="middle" font-size="11" fill="#166534">熱力 COP 0.5–0.6</text>
    <text x="390" y="393" text-anchor="middle" font-size="10" fill="#166534">冬強夏弱</text>

    <!-- 備援電動冰機 -->
    <rect x="330" y="430" width="120" height="65" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="390" y="478" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e3a8a">電動冰機</text>
    <text x="390" y="492" text-anchor="middle" font-size="10.5" fill="#1e40af">只補不足（夏季）</text>
    <use href="#bolt" transform="translate(386,526) scale(0.6)"/>
    <text x="390" y="560" text-anchor="middle" font-size="11.5" fill="#a16207">電力 ≈ 108 kW（冬季接近 0）</text>

    <use href="#tower"/>
    <text x="600" y="470" text-anchor="middle" font-size="11" fill="#0f766e">合計排熱</text><text x="600" y="488" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f766e">10.13 MW</text><text x="335" y="590" text-anchor="middle" font-size="10.5" fill="#6b7280">數字：情境 B、回水 52 °C、吸附機 1.5×Q_air 之年平均</text>
    <!-- 熱流帶（寬度 ∝ 年平均熱流） -->
    <path d="M188.0,196.0 C253.5,196.0 253.5,196.0 319.0,196.0 L319.0,249.5 C253.5,249.5 253.5,249.5 188.0,249.5 Z" fill="#dc2626" fill-opacity="0.88"/><path d="M319.0,186.4 L330.0,222.7 L319.0,259.1 Z" fill="#dc2626" fill-opacity="0.88"/>
    <text x="259" y="227.73125" text-anchor="middle" font-size="15" font-weight="bold" fill="#fff">8.2 MW</text>
    <text x="259" y="188" text-anchor="middle" font-size="11" font-weight="bold" fill="#b91c1c">回水 52 °C</text>
    <text x="259" y="263.4625" text-anchor="middle" font-size="10" fill="#b45309">供水 42 °C</text>
    <path d="M450.0,196.0 C498.9,196.0 498.9,196.0 547.8,196.0 L547.8,235.4 C498.9,235.4 498.9,235.4 450.0,235.4 Z" fill="#0d9488" fill-opacity="0.88"/><path d="M547.8,188.9 L558.8,215.7 L547.8,242.5 Z" fill="#0d9488" fill-opacity="0.88"/>
    <text x="500" y="220.708" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">6.06 MW</text>
    <text x="500" y="188" text-anchor="middle" font-size="10.5" fill="#0f766e">剩餘廢熱</text>
    <rect x="391.0" y="270.0" width="14.0" height="32.0" fill="#dc2626" fill-opacity="0.88"/><path d="M387.5,302.0 L398.0,312.0 L408.5,302.0 Z" fill="#dc2626" fill-opacity="0.88"/>
    <text x="412" y="289" text-anchor="start" font-size="10.5" fill="#b91c1c">驅動熱水 50 °C</text>
    <text x="412" y="303" text-anchor="start" font-size="12" font-weight="bold" fill="#b91c1c">2.16 MW</text>
    <path d="M188.0,372.0 C253.5,372.0 253.5,336.0 319.0,336.0 L319.0,343.6 C253.5,343.6 253.5,379.6 188.0,379.6 Z" fill="#2563eb" fill-opacity="0.88"/><path d="M319.0,332.5 L330.0,339.8 L319.0,347.1 Z" fill="#2563eb" fill-opacity="0.88"/>
    <path d="M188.0,379.6 C253.5,379.6 253.5,458.0 319.0,458.0 L319.0,462.1 C253.5,462.1 253.5,383.7 188.0,383.7 Z" fill="#2563eb" fill-opacity="0.88"/><path d="M319.0,454.5 L330.0,460.0 L319.0,465.6 Z" fill="#2563eb" fill-opacity="0.88"/>
    <text x="272" y="340" text-anchor="middle" font-size="11" font-weight="bold" fill="#1d4ed8">1.17 MW</text>
    <text x="296" y="446" text-anchor="middle" font-size="11" font-weight="bold" fill="#1d4ed8">0.63 MW</text>
    <text x="290" y="476" text-anchor="middle" font-size="10" fill="#3b82f6">冰水 18 °C</text>
    <path d="M450.0,330.0 C496.9,330.0 496.9,330.0 543.9,330.0 L543.9,351.7 C496.9,351.7 496.9,351.7 450.0,351.7 Z" fill="#0d9488" fill-opacity="0.88"/><path d="M543.9,326.1 L554.9,340.8 L543.9,355.6 Z" fill="#0d9488" fill-opacity="0.88"/>
    <text x="500" y="345.83225" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">3.33 MW</text>
    <text x="500" y="365.6645" text-anchor="middle" font-size="10" fill="#0f766e">≈30 °C 冷卻水</text>
    <text x="500" y="379.6645" text-anchor="middle" font-size="10.5" fill="#7c3aed">輔機耗電↑</text>
    <path d="M450.0,456.0 C495.1,456.0 495.1,456.0 540.2,456.0 L540.2,460.8 C495.1,460.8 495.1,460.8 450.0,460.8 Z" fill="#0d9488" fill-opacity="0.88"/><path d="M540.2,452.5 L551.2,458.4 L540.2,464.3 Z" fill="#0d9488" fill-opacity="0.88"/>
    <text x="500" y="449" text-anchor="middle" font-size="11" font-weight="bold" fill="#0f766e">0.74 MW</text>
    <rect x="388.8" y="505.0" width="2.5" height="21.0" fill="#eab308" fill-opacity="0.88"/><path d="M385.2,505.0 L390.0,495.0 L394.8,505.0 Z" fill="#eab308" fill-opacity="0.88"/>
    <text x="335" y="620" text-anchor="middle" font-size="12.5" fill="#374151">省下冰機的電，但換來<tspan font-weight="bold" fill="#dc2626">晶片升溫</tspan>與<tspan font-weight="bold" fill="#7c3aed">更多輔機耗電</tspan></text>
  </g>

  <!-- ================= 下：核心取捨 ================= -->
  <text x="20" y="682" font-size="17" font-weight="bold" fill="#111827">核心取捨：淨節省 ΔP ＝ 好處 − 兩個代價（以年平均功率計）</text>

  <rect x="20" y="698" width="300" height="104" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="170" y="726" text-anchor="middle" font-size="15" font-weight="bold" fill="#14532d">＋ 電動冰機省下的電</text>
  <text x="170" y="752" text-anchor="middle" font-size="14" fill="#166534">Q_air ÷ COP_e</text>
  <text x="170" y="778" text-anchor="middle" font-size="12" fill="#166534">上限 ≈ 260 kW（冷量全由吸附機供應時）</text>

  <text x="337" y="760" text-anchor="middle" font-size="30" font-weight="bold" fill="#374151">−</text>

  <rect x="355" y="698" width="320" height="104" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="515" y="726" text-anchor="middle" font-size="15" font-weight="bold" fill="#991b1b">ΔP_IT 晶片升溫多耗的電</text>
  <text x="515" y="752" text-anchor="middle" font-size="14" fill="#991b1b">k_leak × 8.2 MW × 供水升溫 ΔT</text>
  <text x="515" y="778" text-anchor="middle" font-size="12" fill="#991b1b">k_leak 0.15 %/K → 供水每升 1 K 多 ≈ 12 kW</text>

  <text x="692" y="760" text-anchor="middle" font-size="30" font-weight="bold" fill="#374151">−</text>

  <rect x="710" y="698" width="300" height="104" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="860" y="726" text-anchor="middle" font-size="15" font-weight="bold" fill="#5b21b6">ΔP_aux 輔機多耗的電</text>
  <text x="860" y="752" text-anchor="middle" font-size="13" fill="#5b21b6">吸附機本體＋熱水泵＋冷卻塔多排熱</text>
  <text x="860" y="778" text-anchor="middle" font-size="12" fill="#5b21b6">約 60–110 kW（隨吸附機出力增加）</text>

  <text x="1027" y="760" text-anchor="middle" font-size="30" font-weight="bold" fill="#374151">＝</text>

  <rect x="1045" y="698" width="335" height="104" rx="10" fill="#f9fafb" stroke="#111827" stroke-width="2"/>
  <text x="1212" y="726" text-anchor="middle" font-size="15" font-weight="bold" fill="#111827">淨節省 ΔP</text>
  <text x="1212" y="752" text-anchor="middle" font-size="12.5" fill="#b91c1c">A 冷水基準：所有回水溫度都 &lt; 0</text>
  <text x="1212" y="776" text-anchor="middle" font-size="12.5" fill="#15803d">B 溫水基準：52–62 °C 為正，最多 ≈ 100 kW</text>

  <!-- 兩個關鍵限制 -->
  <rect x="20" y="818" width="660" height="66" rx="10" fill="#fffbeb" stroke="#d97706"/>
  <text x="36" y="842" font-size="13" font-weight="bold" fill="#92400e">為什麼溫度不是越高越好？</text>
  <text x="36" y="864" font-size="12" fill="#78350f">吸附機要 ≥50 °C 熱水才會動（回水 ≥52 °C）；動起來後冰機省電很快就飽和，</text>
  <text x="36" y="880" font-size="12" fill="#78350f">ΔP_IT 卻隨溫度一直增加 → 最佳點 ≈「剛好能驅動吸附機的最低回水溫度」。</text>

  <rect x="700" y="818" width="680" height="66" rx="10" fill="#f0f9ff" stroke="#0284c7"/>
  <text x="716" y="842" font-size="13" font-weight="bold" fill="#075985">經濟評估怎麼算？</text>
  <text x="716" y="864" font-size="12" fill="#0c4a6e">CAPEX（設備單價 × 安裝係數 1.6 ＋ 整合費）→ 每年省電費・水費 − 維護費</text>
  <text x="716" y="880" font-size="12" fill="#0c4a6e">→ 折現率 7%、15 年 → NPV／IRR／回收年限（決策變數：回水溫度 × 吸附機容量）</text>
</svg>
